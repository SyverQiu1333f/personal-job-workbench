{% extends 'base.html' %}{% from 'macros.html' import tokens with context %}{% block body %}<h1>标签管理</h1><p>在岗位编辑时自由创建或移除关联。这里重命名会保留所有岗位关联。</p>{% for t in rows %}<form method="post" class="card inline">{{ tokens() }}<input type="hidden" name="id" value="{{ t.id }}"><input type="hidden" name="row_version" value="{{ t.row_version }}"><input name="name" value="{{ entered.get('name') if entered.get('id')==t.id|string else t.name }}" required><button>重命名</button></form>{% else %}<p>尚无标签</p>{% endfor %}{% endblock %}
