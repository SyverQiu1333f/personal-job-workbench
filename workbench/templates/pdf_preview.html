<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PDF 预览</title>{% include 'icons.html' %}<link rel="stylesheet" href="/static/pdf-viewer.css?v={{ app_version }}"><script type="module" src="/static/pdf-viewer.mjs"></script></head><body><header><button id="previous">上一页</button><span id="page-status">正在读取 PDF…</span><button id="next">下一页</button><label>缩放 <select id="scale"><option value="0.8">80%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label><a href="/file/{{ file.id }}?download=1" target="_blank">下载原件</a></header><p id="error" role="alert"></p><main id="viewer" data-file-id="{{ file.id }}" data-size="{{ file.size }}" data-csrf="{{ csrf }}" data-epoch="{{ data_epoch }}"><canvas id="page" aria-label="PDF 页面"></canvas></main></body></html>
